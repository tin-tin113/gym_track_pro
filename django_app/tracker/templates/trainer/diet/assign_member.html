{% extends "base.html" %}
{% block title %}Assign Diet - GymTrack Pro{% endblock %}
{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">🥗 Assign Diet to {{ member.user.full_name }}</h1>
    </div>
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                        <div class="form-group mb-3">
                            <label class="form-label">Select Diet Plan *</label>
                            <select class="form-control" name="diet_plan_id" required>
                                <option value="">-- Choose a Diet --</option>
                                {% for plan in plans %}
                                <option value="{{ plan.id }}">{{ plan.name }} ({{ plan.daily_calories }} cal)</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" name="start_date" value="{{ now()|strftime('%Y-%m-%d') }}">
                                <small class="text-muted">When diet plan starts</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Target End Date</label>
                                <input type="date" class="form-control" name="target_end_date">
                                <small class="text-muted">When diet plan ends</small>
                            </div>
                        </div>
                        <div class="form-group mb-4">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" name="notes" rows="4"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <i class="fas fa-check"></i> Assign Diet
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
