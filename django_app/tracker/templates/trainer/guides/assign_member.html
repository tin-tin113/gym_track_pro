{% extends "base.html" %}
{% block title %}Assign Guide - GymTrack Pro{% endblock %}
{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">📖 Assign Guide to {{ member.user.full_name }}</h1>
    </div>
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label class="form-label">Select Guide *</label>
                            <select class="form-control" name="guide_id" required>
                                <option value="">-- Choose a Guide --</option>
                                {% for guide in guides %}
                                <option value="{{ guide.id }}">{{ guide.name }} ({{ guide.difficulty_level }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" name="start_date" value="{% now 'Y-m-d' %}">
                                <small class="text-muted">When should the guide start (defaults to today)</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Target Completion Date</label>
                                <input type="date" class="form-control" name="target_completion_date">
                                <small class="text-muted">When should it be completed</small>
                            </div>
                        </div>
                        <div class="form-group mb-4">
                            <label class="form-label">Trainer Notes</label>
                            <textarea class="form-control" name="notes" rows="4" placeholder="Instructions or goals for this guide..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-gym-action w-100">
                            <i class="fas fa-check"></i> Assign Guide
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
