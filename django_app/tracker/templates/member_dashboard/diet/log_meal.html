{% extends "base.html" %}

{% block title %}Log Meal - GymTrack Pro{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">🍽️ Log Meal</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <!-- Meal Date -->
                        <div class="form-group mb-3">
                            <label class="form-label">Meal Date *</label>
                            <input type="date" class="form-control" name="meal_date" value="{{ now().date().isoformat() }}" required>
                        </div>

                        <!-- Meal Type -->
                        <div class="form-group mb-3">
                            <label class="form-label">Meal Type *</label>
                            <select class="form-control" name="meal_type" required>
                                <option value="">Select Meal Type</option>
                                <option value="breakfast">Breakfast</option>
                                <option value="lunch">Lunch</option>
                                <option value="dinner">Dinner</option>
                                <option value="snack">Snack</option>
                            </select>
                        </div>

                        <!-- Meal Name -->
                        <div class="form-group mb-3">
                            <label class="form-label">Meal Name *</label>
                            <input type="text" class="form-control" name="meal_name" required placeholder="e.g., Grilled Chicken with Rice">
                        </div>

                        <!-- Calories -->
                        <div class="form-group mb-3">
                            <label class="form-label">Calories *</label>
                            <input type="number" class="form-control" name="calories_actual" required placeholder="500">
                        </div>

                        <div class="row">
                            <!-- Protein -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Protein (g)</label>
                                <input type="number" step="0.1" class="form-control" name="protein_g" placeholder="25">
                            </div>

                            <!-- Carbs -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Carbs (g)</label>
                                <input type="number" step="0.1" class="form-control" name="carbs_g" placeholder="50">
                            </div>

                            <!-- Fats -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Fats (g)</label>
                                <input type="number" step="0.1" class="form-control" name="fats_g" placeholder="15">
                            </div>
                        </div>

                        <!-- Notes -->
                        <div class="form-group mb-4">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" name="notes" rows="3" placeholder="Any additional notes..."></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">
                                <i class="fas fa-check"></i> Log Meal
                            </button>
                            <a href="{{ url_for('member.current_diet') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Quick Suggestions -->
            {% if suggested_meals %}
            <div class="card mt-4">
                <div class="card-header">Quick Suggestions from Your Diet Plan</div>
                <div class="card-body">
                    <p class="text-muted mb-3" style="font-size: 0.9rem;">Click a meal to pre-fill the form</p>
                    {% for meal in suggested_meals[:5] %}
                    <button type="button" class="btn btn-outline-primary btn-sm w-100 mb-2" onclick="fillMeal('{{ meal.meal_name }}', {{ meal.calories }}, {{ meal.protein_g or 0 }}, {{ meal.carbs_g or 0 }}, {{ meal.fats_g or 0 }})">
                        {% if meal.meal_type == 'breakfast' %}<i class="fas fa-coffee"></i>{% elif meal.meal_type == 'lunch' %}<i class="fas fa-utensils"></i>{% elif meal.meal_type == 'dinner' %}<i class="fas fa-bowl-food"></i>{% else %}<i class="fas fa-cookie"></i>{% endif %}
                        {{ meal.meal_name }}
                    </button>
                    {% endfor %}
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</div>

<script>
function fillMeal(name, calories, protein, carbs, fats) {
    document.querySelector('input[name="meal_name"]').value = name;
    document.querySelector('input[name="calories_actual"]').value = calories;
    document.querySelector('input[name="protein_g"]').value = protein;
    document.querySelector('input[name="carbs_g"]').value = carbs;
    document.querySelector('input[name="fats_g"]').value = fats;
    document.querySelector('input[name="meal_name"]').focus();
}
</script>
{% endblock %}
