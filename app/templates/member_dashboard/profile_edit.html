{% extends 'base.html' %}
{% block title %}Edit Profile - GymTrack Pro{% endblock %}
{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Edit Profile</h1>
    
    <form method="POST" class="card p-4">
        <div class="mb-3">
            <label for="full_name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ member.user.full_name }}" required>
        </div>
        
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ member.user.email }}" required>
        </div>
        
        <div class="mb-3">
            <label for="phone_number" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone_number" name="phone_number" value="{{ member.phone_number or '' }}">
        </div>
        
        <div class="mb-3">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-control" id="gender" name="gender">
                <option value="">Select</option>
                <option value="M" {% if member.gender == 'M' %}selected{% endif %}>Male</option>
                <option value="F" {% if member.gender == 'F' %}selected{% endif %}>Female</option>
                <option value="Other" {% if member.gender == 'Other' %}selected{% endif %}>Other</option>
            </select>
        </div>
        
        <div class="mb-3">
            <label for="date_of_birth" class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" value="{{ member.date_of_birth or '' }}">
        </div>
        
        <div class="btn-group mt-4" role="group">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('member.member_profile') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
